<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLD Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --ink:#09111f;
    --ink-soft:#202b3c;
    --muted:#667085;
    --paper:#fbfaf6;
    --surface:#ffffff;
    --wash:#eef2f4;
    --line:#d8dee6;
    --blue:#2b64d8;
    --focus:#c87912;
    --radius:8px;
    --gutter:clamp(20px, 4vw, 48px);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:16px;
    line-height:1.6;
    font-synthesis:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    flex-direction:column;
  }

  a{color:var(--blue); text-decoration-thickness:1px; text-underline-offset:2px;}
  a:hover{text-decoration-thickness:2px;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px;}

  /* ---------- masthead ---------- */
  .masthead{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:20px var(--gutter);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead-left{display:flex; align-items:center; gap:10px;}
  .wordmark{font-weight:800; font-size:19px; letter-spacing:0; color:var(--ink);}
  .wordmark span{color:var(--blue);}
  .masthead-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .masthead-sub{font-size:13px; color:var(--muted);}
  .mast-auth{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
  .mast-auth-name{font-weight:600; color:var(--ink);}
  .mast-auth-email{font-weight:400; color:var(--muted);}
  .auth-signin{
    display:inline-flex; align-items:center; gap:7px;
    font-family:inherit; font-weight:600; font-size:13px;
    color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:9px 15px; cursor:pointer;
  }
  .auth-signin:hover{border-color:var(--blue); color:var(--blue);}
  .btn-text{
    font-family:inherit; font-weight:600; font-size:13px; color:var(--blue);
    background:none; border:none; padding:0; cursor:pointer;
  }

  /* ---------- site nav ---------- */
  .shell{display:flex; align-items:stretch; flex:1 1 auto;}
  .sidebar{
    flex:0 0 210px; width:210px; box-sizing:border-box;
    border-right:1px solid var(--line); background:var(--surface);
  }
  .sidebar-inner{
    position:sticky; top:0; padding:18px 12px;
    max-height:100vh; overflow-y:auto;
  }
  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 6px 14px; margin-bottom:6px; border-bottom:1px solid var(--line);
  }
  .sidebar-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);}
  .sidebar-collapse{
    font-family:inherit; background:none; border:1px solid var(--line); border-radius:6px;
    width:24px; height:24px; color:var(--muted); cursor:pointer; font-size:12px; line-height:1; flex:none;
  }
  .sidebar-collapse:hover{color:var(--blue); border-color:var(--blue);}
  .nav-group{margin:16px 0;}
  .nav-group:first-child{margin-top:0;}
  .nav-group-label{
    display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--muted); padding:7px 6px; margin-bottom:2px; text-decoration:none; border-radius:6px;
  }
  .nav-group-label:hover{background:var(--wash); color:var(--ink);}
  .nav-group-label.active{background:#e3ebfc; color:var(--blue);}
  .nav-link{
    display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    text-decoration:none; padding:7px 6px; border-radius:6px; white-space:nowrap;
  }
  .nav-link:hover{background:var(--wash); color:var(--ink);}
  .nav-link.active{background:#e3ebfc; color:var(--blue);}
  .nav-link.nav-sub{font-weight:500; font-size:13px; padding-left:16px;}
  .nav-toggle:focus-visible, .sidebar-collapse:focus-visible, .nav-link:focus-visible, .nav-group-label:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px; border-radius:6px;
  }

  .shell-main{flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center;}

  .nav-toggle{
    display:none; font-family:inherit; background:none; border:1px solid var(--line); border-radius:6px;
    width:34px; height:34px; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
    position:relative; flex:none;
  }
  .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
    position:absolute; left:9px; width:16px; height:2px; background:currentColor; content:'';
  }
  .nav-toggle span::before{top:-5px;}
  .nav-toggle span::after{top:5px;}

  .sidebar-backdrop{display:none;}

  .shell.is-collapsed .sidebar{flex-basis:44px; width:44px;}
  .shell.is-collapsed .sidebar-inner{padding:18px 6px;}
  .shell.is-collapsed .sidebar-title, .shell.is-collapsed .nav-groups{display:none;}
  .shell.is-collapsed .sidebar-head{justify-content:center; border-bottom:none; padding-bottom:0;}

  @media (max-width:820px){
    .nav-toggle{display:inline-flex;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:200;
      height:100%; width:240px; flex-basis:240px;
      transform:translateX(-100%); transition:transform 0.2s ease;
      box-shadow:0 14px 44px #09111f2e;
    }
    .sidebar-inner{height:100%; max-height:none; overflow-y:auto;}
    .shell.is-nav-open .sidebar{transform:translateX(0);}
    .shell.is-collapsed .sidebar{width:240px; flex-basis:240px;}
    .shell.is-collapsed .sidebar-inner{padding:18px 12px;}
    .shell.is-collapsed .sidebar-title, .shell.is-collapsed .nav-groups{display:block;}
    .shell.is-collapsed .sidebar-head{justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:14px;}
    .sidebar-collapse{display:none;}
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:#09111f66; z-index:190;
      border:none; padding:0; margin:0;
    }
    .shell.is-nav-open .sidebar-backdrop{display:block;}
  }

  /* ---------- hero ---------- */
  .home-hero h1{
    margin:0;
    font-weight:400;
    font-size:clamp(28px, 6vw, 52px);
    letter-spacing:0;
    color:var(--ink);
    text-align:center;
  }
  .home-hero h1 strong{font-weight:800; color:var(--blue);}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-left">
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar"><span></span></button>
    <span class="wordmark">BOLD<span>.</span> Lab</span>
  </div>
  <div class="masthead-right">
    <div class="masthead-sub">Internal</div>
    <div id="authRegion"></div>
  </div>
</div>

<div class="shell" id="shell">
 <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation"></button>
 <nav class="sidebar" id="sidebar" aria-label="Site navigation">
 <div class="sidebar-inner">
 <div class="sidebar-head">
 <span class="sidebar-title">Menu</span>
 <button class="sidebar-collapse" id="sidebarCollapse" type="button" aria-label="Collapse navigation" title="Collapse">&laquo;</button>
 </div>
 <div class="nav-groups">
 <div class="nav-group">
 <a class="nav-group-label" href="how-to-submit-a-paper.html">Internal Review</a>
 <a class="nav-link nav-sub" href="audit-board.html">Board</a>
 </div>
 <div class="nav-group">
 <a class="nav-group-label" href="events.html">All events</a>
 <a class="nav-link nav-sub" href="event-collaboration-week.html">Collaboration Week</a>
 <a class="nav-link nav-sub" href="event-bold-festival.html">Festival</a>
 </div>
 </div>
 </div>
 </nav>
  <div class="shell-main">

<div class="home-hero">
  <h1>The <strong>BOLD</strong></h1>
</div>

  </div>
</div>

<script>
(function(){
  var shell = document.getElementById('shell');
  if (!shell) return;
  var toggle = document.getElementById('navToggle');
  var collapse = document.getElementById('sidebarCollapse');
  var backdrop = document.getElementById('sidebarBackdrop');
  var sidebar = document.getElementById('sidebar');

  function setCollapsed(on){
    shell.classList.toggle('is-collapsed', on);
    if (collapse){
      collapse.innerHTML = on ? '&raquo;' : '&laquo;';
      collapse.setAttribute('aria-label', on ? 'Expand navigation' : 'Collapse navigation');
    }
    try { localStorage.setItem('boldNavCollapsed', on ? '1' : '0'); } catch (e){}
  }
  function openNav(){
    shell.classList.add('is-nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'true');
  }
  function closeNav(){
    shell.classList.remove('is-nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  }

  if (collapse) collapse.addEventListener('click', function(){
    setCollapsed(!shell.classList.contains('is-collapsed'));
  });
  if (toggle) toggle.addEventListener('click', function(){
    if (shell.classList.contains('is-nav-open')) { closeNav(); } else { openNav(); }
  });
  if (backdrop) backdrop.addEventListener('click', closeNav);
  if (sidebar){
    Array.prototype.slice.call(sidebar.querySelectorAll('.nav-link, .nav-group-label')).forEach(function(a){
      a.addEventListener('click', closeNav);
    });
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeNav(); });

  try {
    if (localStorage.getItem('boldNavCollapsed') === '1') setCollapsed(true);
  } catch (e){}
})();
</script>

<script>
(function(){
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDNKEMYuV0gehbKoM2acafzVbBQL489yDY',
    authDomain: 'bold-d7ff2.firebaseapp.com',
    projectId: 'bold-d7ff2',
    storageBucket: 'bold-d7ff2.firebasestorage.app',
    messagingSenderId: '555050367135',
    appId: '1:555050367135:web:d90f8d7bb93a755e9fcaaa',
    measurementId: 'G-527H8R28KB'
  };
  var AUTH_USE_EMULATOR = false;

  var authRegion = document.getElementById('authRegion');

  var auth = null;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    if (AUTH_USE_EMULATOR) auth.useEmulator('http://localhost:9099');
  } catch (e) { auth = null; }

  if (!auth || !authRegion) return;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function doSignIn(){
    var provider = new firebase.auth.OAuthProvider('oidc.slack');
    provider.addScope('openid');
    provider.addScope('profile');
    provider.addScope('email');
    auth.signInWithPopup(provider).catch(function(err){
      console.error('[BOLD Lab] sign-in failed', err);
    });
  }

  function renderAuthRegion(user){
    if (user) {
      var whoHtml = user.displayName
        ? escapeHtml(user.displayName) + (user.email ? ' <span class="mast-auth-email">(' + escapeHtml(user.email) + ')</span>' : '')
        : escapeHtml(user.email || 'Signed in');
      authRegion.innerHTML =
        '<div class="mast-auth">' +
          '<span class="mast-auth-name">' + whoHtml + '</span>' +
          '<button class="btn-text" type="button" id="mastSignOutBtn">Sign out</button>' +
        '</div>';
      var so = document.getElementById('mastSignOutBtn');
      if (so) so.addEventListener('click', function(){ auth.signOut(); });
    } else {
      authRegion.innerHTML = '<button class="auth-signin" type="button" id="mastSignInBtn">Sign in with Slack</button>';
      var si = document.getElementById('mastSignInBtn');
      if (si) si.addEventListener('click', doSignIn);
    }
  }

  auth.onAuthStateChanged(renderAuthRegion);
})();
</script>

</body>
</html>
