<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLD Lab</title>
<script src="bold.js"></script>
<style>
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.7;
    font-synthesis:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    flex-direction:column;
  }
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  /* .masthead sets its own display, which as an author rule beats the
     browser's default [hidden]{display:none} at equal specificity —
     same trap as .gate-signup-btn earlier, same fix. */
  .masthead[hidden]{display:none;}
  /* ---------- site nav ---------- */
  .shell{display:flex; align-items:stretch; flex:1 1 auto;}
  /* Homepage-only (2026-09-18+5, per Eduardo): the sidebar and masthead
     load visually collapsed even for a signed-in visitor, and open when
     they click the "BOLD.OS" hero heading below — see the auth script's
     revealChrome(). Reuses .sidebar's own flex-basis/width transition
     above rather than a bespoke one, so it opens with the same timing as
     the sidebar-collapse button elsewhere in the app. [hidden] can't be
     transitioned, which is why this is a class instead of the hidden
     attribute the guest/signed-out state below still uses. */
  /* The .is-collapsed variant is listed too: a stored boldNavCollapsed
     preference adds .is-collapsed (a 40px rail with the » button), which
     is declared later at equal specificity and would otherwise win, leaving
     the hero off-centre and shifting it when the sidebar mounts. Also drops
     the border width — a border-box can't be narrower than its border. */
  .shell.chrome-collapsed .sidebar, .shell.chrome-collapsed.is-collapsed .sidebar{flex-basis:0; width:0; border-right-width:0; overflow:hidden;}
  .masthead.chrome-collapsed{
    height:0; padding-top:0; padding-bottom:0; opacity:0; overflow:hidden; border-bottom-color:transparent;
    transition:height .22s ease, padding .22s ease, opacity .18s ease;
  }
  .home-hero h1.hero-clickable{cursor:pointer;}
  .home-hero h1.hero-clickable:focus-visible{outline:2px solid var(--accent); outline-offset:6px;}
  .shell-main{flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center;}
  /* ---------- signed-out signup nudge (reuses the sign-in gate's own styling
     from the other pages, since the homepage doesn't hard-gate its content —
     only the sidebar hides for a signed-out visitor) ---------- */
  .gate-alt{
    font-family:var(--sans); font-size:13px; font-weight:400; color:var(--muted);
    margin:26px 0 0; padding-top:20px; border-top:1px solid var(--line);
  }
  .gate-signup-btn{
    display:inline-block; font-family:var(--sans); font-weight:500; font-size:14px;
    color:var(--ink-soft); text-decoration:underline; text-decoration-color:rgba(26,43,74,.32); text-underline-offset:3px;
    padding:0; margin-top:8px; border:none; background:none; cursor:pointer;
  }
  .home-guest-links{
    display:flex; flex-direction:row; align-items:baseline; justify-content:center; gap:10px;
    margin-top:8px;
  }
  .home-guest-links .gate-signup-btn{margin-top:0;}
  .home-guest-links .home-guest-or{font-family:var(--sans); font-size:12px; color:var(--muted);}
  /* ---------- hero ---------- */
  .home-hero{text-align:center; padding:40px var(--gutter);}
  .home-hero h1{
    font-weight:400;
    font-size:clamp(32px, 7vw, 60px);
    line-height:1.05;
    text-wrap:balance;
  }
  .home-hero h1 strong{font-weight:800; color:var(--accent);}
  #homeGuestNote{margin-top:28px;}
</style>
</head>
<body>

<bold-masthead start-hidden></bold-masthead>

<bold-shell public start-hidden>
  <div class="shell-main">

<div class="home-hero">
  <h1 id="homeHeroTitle"><strong>BOLD</strong>.OS</h1>
  <div id="homeGuestNote" hidden>
    <p class="gate-alt">Not in BOLD?</p>
    <p class="home-guest-links">
      <button class="gate-signup-btn" type="button" id="homeSignInBtn">Log in</button>
      <span class="home-guest-or">or</span>
      <a class="gate-signup-btn" href="https://forms.gle/VzGbWVyERN9v1qJC8" target="_blank" rel="noopener">Sign up</a>
    </p>
  </div>
</div>

</div>
</bold-shell>

<script>
(function(){
  var masthead = document.getElementById('masthead');
  var shell = document.getElementById('shell');
  var sidebar = document.getElementById('sidebar');
  var navToggle = document.getElementById('navToggle');
  var guestNote = document.getElementById('homeGuestNote');
  var heroSignInBtn = document.getElementById('homeSignInBtn');
  var heroTitle = document.getElementById('homeHeroTitle');
  var chromeRevealed = false;

  if (heroSignInBtn) heroSignInBtn.addEventListener('click', BOLD.signIn);

  // Reveals the masthead + sidebar with .sidebar's own transition (see
  // its CSS) rather than the instant [hidden] cut a signed-in visitor got
  // before 2026-09-18+5. Idempotent and only meaningful once signed in —
  // renderGuestChrome below re-collapses (and un-reveals) on sign-out, so
  // a later sign-in starts collapsed again rather than staying open from
  // a previous session.
  function revealChrome(){
    if (chromeRevealed) return;
    chromeRevealed = true;
    if (shell) shell.classList.remove('chrome-collapsed');
    if (masthead) masthead.classList.remove('chrome-collapsed');
    // A stored "collapsed" preference would otherwise open only the 40px
    // rail; clicking the hero means "open it", so expand fully through the
    // sidebar's own button (which also updates its icon and stored state).
    var railBtn = document.getElementById('sidebarCollapse');
    if (shell && railBtn && shell.classList.contains('is-collapsed')) railBtn.click();
  }
  var chromeIsClickable = false;
  if (heroTitle){
    heroTitle.addEventListener('click', function(){ if (chromeIsClickable) revealChrome(); });
    heroTitle.addEventListener('keydown', function(e){
      if (chromeIsClickable && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); revealChrome(); }
    });
  }

  // The homepage's own content (the hero) stays public either way — a
  // signed-out visitor gets no masthead and no sidebar at all, just the
  // hero plus its own brief sign-up/log-in line; the masthead (with its
  // sidebar-only "Internal" branding) only makes sense once someone's
  // actually signed in. Toggling `hidden` on plain wrappers rather than
  // on .masthead/.gate-signup-btn/.auth-signin themselves matters: those
  // classes set their own `display`, which as an author rule beats the
  // browser's default [hidden]{display:none} at equal specificity, so
  // hidden silently does nothing on them directly (see .masthead[hidden]
  // and #pageGate[hidden] on the other pages for the same fix).
  //
  // For a signed-in visitor, masthead/sidebar are unhidden (mounted) but
  // start in the CSS-driven .chrome-collapsed state instead of appearing
  // outright — clicking the "BOLD.OS" hero heading is what actually
  // reveals them, via revealChrome() above (2026-09-18+5, per Eduardo).
  function renderGuestChrome(signedIn){
    if (masthead) masthead.hidden = !signedIn;
    if (sidebar) sidebar.hidden = !signedIn;
    if (navToggle) navToggle.hidden = !signedIn;
    if (guestNote) guestNote.hidden = signedIn;
    chromeIsClickable = signedIn;
    if (heroTitle){
      heroTitle.classList.toggle('hero-clickable', signedIn);
      if (signedIn){
        heroTitle.setAttribute('role', 'button');
        heroTitle.setAttribute('tabindex', '0');
        heroTitle.setAttribute('aria-label', 'Show navigation');
      } else {
        heroTitle.removeAttribute('role');
        heroTitle.removeAttribute('tabindex');
        heroTitle.removeAttribute('aria-label');
      }
    }
    if (signedIn){
      // Guard on chromeRevealed so a second onAuthStateChanged firing
      // while still signed in (e.g. a token refresh) can't re-collapse
      // chrome the visitor already opened this session.
      if (!chromeRevealed){
        if (shell) shell.classList.add('chrome-collapsed');
        if (masthead) masthead.classList.add('chrome-collapsed');
      }
    } else {
      chromeRevealed = false;
      if (shell) shell.classList.remove('chrome-collapsed');
      if (masthead) masthead.classList.remove('chrome-collapsed');
    }
  }

  if (!BOLD.getAuth()) {
    renderGuestChrome(false);
  } else {
    // Auth restores asynchronously, so without this the hero's pointer
    // cursor and click handler only arrive after a beat. The cached hint
    // from the last signed-in visit sets them up front; onAuthStateChanged
    // below corrects it if the session has since expired.
    if (BOLD.authHint()) renderGuestChrome(true);
    BOLD.onUser(function(user){ renderGuestChrome(!!user); });
  }
})();
</script>

</body>
</html>
