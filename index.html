<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLD Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  /* Minimal editorial design system, shared across bold-lab.ai — see
     events.html for the full rationale. */
  :root{
    --ink:#1a2b4a;
    --ink-soft:#33445f;
    --muted:#7d8698;
    --paper:#f5f3ee;
    --surface:#ffffff;
    --wash:#ece9e1;
    --line:rgba(26,43,74,0.16);
    --accent:#1a2b4a;
    --radius:2px;
    --gutter:clamp(20px, 4vw, 48px);
    --serif:'EB Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Cabin', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.7;
    font-synthesis:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    flex-direction:column;
  }

  a{color:var(--accent); text-decoration:underline; text-decoration-color:rgba(26,43,74,.32); text-underline-offset:3px; transition:text-decoration-color .15s;}
  a:hover{text-decoration-color:currentColor;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  h1,h2,h3{
    font-family:var(--serif);
    color:var(--ink);
    font-weight:800;
    letter-spacing:-0.005em;
    margin:0;
  }

  /* ---------- masthead ---------- */
  .masthead{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:18px var(--gutter);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  /* .masthead sets its own display, which as an author rule beats the
     browser's default [hidden]{display:none} at equal specificity —
     same trap as .gate-signup-btn earlier, same fix. */
  .masthead[hidden]{display:none;}
  .masthead-left{display:flex; align-items:center; gap:10px;}
  .wordmark{
    font-family:var(--sans);
    font-weight:500;
    font-size:17px;
    letter-spacing:-0.01em;
    color:var(--ink);
    text-decoration:none;
  }
  .wordmark span{color:var(--accent); opacity:.55;}
  .masthead-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .masthead-sub{
    font-family:var(--sans);
    font-size:11px;
    font-weight:400;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:.7;
  }
  .mast-auth{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); font-family:var(--sans);}
  .mast-auth-name{font-weight:500; color:var(--ink);}
  .mast-auth-email{font-weight:400; color:var(--muted);}
  .auth-signin{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--sans); font-weight:500; font-size:15px;
    color:var(--ink); background:none; border:1px solid var(--ink);
    padding:10px 22px; cursor:pointer;
  }
  .auth-signin:hover{background:var(--ink); color:var(--paper);}
  .btn-text{
    font-family:var(--sans); font-weight:400; font-size:12.5px;
    color:var(--accent); background:none; border:none; padding:0; cursor:pointer;
    text-decoration:underline; text-decoration-color:rgba(26,43,74,.32); text-underline-offset:2px;
  }
  .btn-text:hover{text-decoration-color:currentColor;}

  /* ---------- site nav ---------- */
  .shell{display:flex; align-items:stretch; flex:1 1 auto;}
  .sidebar{
    flex:0 0 200px; width:200px; box-sizing:border-box;
    border-right:1px solid var(--line); background:var(--paper);
    transition:flex-basis .22s ease, width .22s ease;
  }
  .sidebar-inner{
    position:sticky; top:0; padding:22px 16px;
    max-height:100vh; overflow-y:auto;
    transition:padding .22s ease;
  }
  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 0 16px; margin-bottom:10px; border-bottom:1px solid var(--line);
  }
  .sidebar-title{font-family:var(--sans); font-size:11px; font-weight:400; text-transform:uppercase; letter-spacing:0.16em; color:var(--muted); opacity:.7;}
  .sidebar-collapse{
    font-family:inherit; background:none; border:1px solid var(--line);
    width:22px; height:22px; color:var(--muted); cursor:pointer; font-size:12px; line-height:1; flex:none;
  }
  .sidebar-collapse:hover{border-color:var(--accent); color:var(--accent);}
  .nav-group{margin:18px 0;}
  .nav-group:first-child{margin-top:0;}
  .nav-group-label{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:var(--sans); font-size:13px; font-weight:600;
    color:var(--ink); padding:4px 0; margin-bottom:2px; text-decoration:none;
  }
  .nav-group-label:hover{color:var(--accent);}
  .nav-group-label.active{color:var(--accent);}
  /* Chevron hints that a group has hidden sub-links: points right while
     collapsed, rotates to point down on hover/focus, in step with the
     sub-links expanding below it. */
  .nav-group-label::after{
    content:'';
    width:8px; height:1.5px; flex:none;
    background:currentColor;
    opacity:.4;
    transition:width .22s ease, opacity .18s ease;
  }
  .nav-group:hover .nav-group-label::after,
  .nav-group:focus-within .nav-group-label::after{
    width:14px; opacity:.75;
  }
  .nav-link{
    display:block; font-family:var(--sans); font-size:13px; font-weight:400; color:var(--ink-soft);
    text-decoration:none; padding:4px 0; white-space:nowrap;
  }
  .nav-link:hover{color:var(--accent);}
  .nav-link.active{color:var(--accent); font-weight:600;}
  /* Sub-links collapse to nothing by default and expand on hover/focus
     of their group, except the current page's own link, which stays
     visible so the sidebar always shows where you are without hovering. */
  .nav-link.nav-sub{
    font-weight:400; font-size:12.5px; padding-left:12px; color:var(--muted);
    max-height:0; opacity:0; overflow:hidden; pointer-events:none;
    transition:max-height .22s ease, opacity .18s ease;
  }
  .nav-group:hover .nav-link.nav-sub,
  .nav-group:focus-within .nav-link.nav-sub,
  .nav-link.nav-sub.active{
    max-height:32px; opacity:1; pointer-events:auto;
  }
  .nav-link.nav-sub:hover, .nav-link.nav-sub.active{color:var(--accent);}
  .nav-toggle:focus-visible, .sidebar-collapse:focus-visible, .nav-link:focus-visible, .nav-group-label:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .shell-main{flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center;}

  .nav-toggle{
    display:none; font-family:inherit; background:none; border:1px solid var(--line);
    width:32px; height:32px; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
    position:relative; flex:none;
  }
  .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after{
    position:absolute; left:9px; width:16px; height:1.5px; background:currentColor; content:'';
  }
  .nav-toggle span::before{top:-5px;}
  .nav-toggle span::after{top:5px;}

  .sidebar-backdrop{display:none;}

  .shell.is-collapsed .sidebar{flex-basis:40px; width:40px;}
  .shell.is-collapsed .sidebar-inner{padding:22px 8px;}
  .shell.is-collapsed .sidebar-title, .shell.is-collapsed .nav-groups{display:none;}
  .shell.is-collapsed .sidebar-head{justify-content:center; border-bottom:none; padding-bottom:0;}

  @media (max-width:820px){
    .nav-toggle{display:inline-flex;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:200;
      height:100%; width:240px; flex-basis:240px;
      transform:translateX(-100%); transition:transform 0.2s ease;
      box-shadow:0 14px 44px rgba(26,43,74,.18);
    }
    .sidebar-inner{height:100%; max-height:none; overflow-y:auto;}
    .shell.is-nav-open .sidebar{transform:translateX(0);}
    .shell.is-collapsed .sidebar{width:240px; flex-basis:240px;}
    .shell.is-collapsed .sidebar-inner{padding:22px 16px;}
    .shell.is-collapsed .sidebar-title, .shell.is-collapsed .nav-groups{display:block;}
    .shell.is-collapsed .sidebar-head{justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:16px;}
    .sidebar-collapse{display:none;}
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:rgba(26,43,74,.35); z-index:190;
      border:none; padding:0; margin:0;
    }
    .shell.is-nav-open .sidebar-backdrop{display:block;}
  }

  /* ---------- signed-out signup nudge (reuses the sign-in gate's own styling
     from the other pages, since the homepage doesn't hard-gate its content —
     only the sidebar hides for a signed-out visitor) ---------- */
  .gate-alt{
    font-family:var(--sans); font-size:13px; font-weight:400; color:var(--muted);
    margin:26px 0 0; padding-top:20px; border-top:1px solid var(--line);
  }
  .gate-signup-btn{
    display:inline-block; font-family:var(--sans); font-weight:500; font-size:14px;
    color:var(--ink-soft); text-decoration:underline; text-decoration-color:rgba(26,43,74,.32); text-underline-offset:3px;
    padding:0; margin-top:8px; border:none; background:none; cursor:pointer;
  }
  .gate-signup-btn:hover{text-decoration-color:currentColor;}
  .home-guest-links{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    margin-top:8px;
  }
  .home-guest-links .gate-signup-btn{margin-top:0;}
  .home-guest-links .home-guest-or{font-family:var(--sans); font-size:12px; color:var(--muted);}

  /* ---------- hero ---------- */
  .home-hero{text-align:center; padding:40px var(--gutter);}
  .home-hero h1{
    font-weight:400;
    font-size:clamp(32px, 7vw, 60px);
    line-height:1.05;
    text-wrap:balance;
  }
  .home-hero h1 strong{font-weight:800; color:var(--accent);}
  #homeGuestNote{margin-top:28px;}
</style>
</head>
<body>

<div class="masthead" id="masthead" hidden>
  <div class="masthead-left">
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar" hidden><span></span></button>
    <a class="wordmark" href="index.html">BOLD<span>.</span>OS</a>
  </div>
  <div class="masthead-right">
    <div class="masthead-sub">Internal</div>
    <div id="authRegion"></div>
  </div>
</div>

<div class="shell" id="shell">
 <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation"></button>
 <nav class="sidebar" id="sidebar" aria-label="Site navigation" hidden>
 <div class="sidebar-inner">
 <div class="sidebar-head">
 <span class="sidebar-title">Menu</span>
 <button class="sidebar-collapse" id="sidebarCollapse" type="button" aria-label="Collapse navigation" title="Collapse">&laquo;</button>
 </div>
 <div class="nav-groups">
 <div class="nav-group">
 <a class="nav-group-label" href="how-to-submit-a-paper.html">ML Conference Cycle</a>
 <a class="nav-link nav-sub" href="audit-board.html">Internal review board</a>
 </div>
 <div class="nav-group">
 <a class="nav-group-label" href="events.html">Events</a>
 <a class="nav-link nav-sub" href="event-collaboration-week.html">Collaboration Week</a>
 <a class="nav-link nav-sub" href="event-bold-festival.html">BOLD Festival 2026</a>
 </div>
 </div>
 </div>
 </nav>
  <div class="shell-main">

<div class="home-hero">
  <h1><strong>BOLD</strong>.OS</h1>
  <div id="homeGuestNote" hidden>
    <p class="gate-alt">Not in the BOLD Slack yet?</p>
    <p class="home-guest-links">
      <a class="gate-signup-btn" href="https://forms.gle/VzGbWVyERN9v1qJC8" target="_blank" rel="noopener">Sign up here</a>
      <span class="home-guest-or">or</span>
      <button class="gate-signup-btn" type="button" id="homeSignInBtn">log in here</button>
    </p>
  </div>
</div>

  </div>
</div>

<script>
(function(){
  var shell = document.getElementById('shell');
  if (!shell) return;
  var toggle = document.getElementById('navToggle');
  var collapse = document.getElementById('sidebarCollapse');
  var backdrop = document.getElementById('sidebarBackdrop');
  var sidebar = document.getElementById('sidebar');

  function setCollapsed(on){
    shell.classList.toggle('is-collapsed', on);
    if (collapse){
      collapse.innerHTML = on ? '&raquo;' : '&laquo;';
      collapse.setAttribute('aria-label', on ? 'Expand navigation' : 'Collapse navigation');
    }
    try { localStorage.setItem('boldNavCollapsed', on ? '1' : '0'); } catch (e){}
  }
  function openNav(){
    shell.classList.add('is-nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'true');
  }
  function closeNav(){
    shell.classList.remove('is-nav-open');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  }

  if (collapse) collapse.addEventListener('click', function(){
    setCollapsed(!shell.classList.contains('is-collapsed'));
  });
  if (toggle) toggle.addEventListener('click', function(){
    if (shell.classList.contains('is-nav-open')) { closeNav(); } else { openNav(); }
  });
  if (backdrop) backdrop.addEventListener('click', closeNav);
  if (sidebar){
    Array.prototype.slice.call(sidebar.querySelectorAll('.nav-link, .nav-group-label')).forEach(function(a){
      a.addEventListener('click', closeNav);
    });
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeNav(); });

  try {
    if (localStorage.getItem('boldNavCollapsed') === '1') setCollapsed(true);
  } catch (e){}
})();
</script>

<script>
(function(){
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyDNKEMYuV0gehbKoM2acafzVbBQL489yDY',
    authDomain: 'bold-d7ff2.firebaseapp.com',
    projectId: 'bold-d7ff2',
    storageBucket: 'bold-d7ff2.firebasestorage.app',
    messagingSenderId: '555050367135',
    appId: '1:555050367135:web:d90f8d7bb93a755e9fcaaa',
    measurementId: 'G-527H8R28KB'
  };
  var AUTH_USE_EMULATOR = false;

  var masthead = document.getElementById('masthead');
  var authRegion = document.getElementById('authRegion');
  var sidebar = document.getElementById('sidebar');
  var navToggle = document.getElementById('navToggle');
  var guestNote = document.getElementById('homeGuestNote');
  var heroSignInBtn = document.getElementById('homeSignInBtn');

  var auth = null;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    if (AUTH_USE_EMULATOR) auth.useEmulator('http://localhost:9099');
  } catch (e) { auth = null; }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function doSignIn(){
    var provider = new firebase.auth.OAuthProvider('oidc.slack');
    provider.addScope('openid');
    provider.addScope('profile');
    provider.addScope('email');
    auth.signInWithPopup(provider).catch(function(err){
      console.error('[BOLD Lab] sign-in failed', err);
    });
  }

  function renderAuthRegion(user){
    if (!authRegion) return;
    if (user) {
      var whoHtml = user.displayName
        ? escapeHtml(user.displayName) + (user.email ? ' <span class="mast-auth-email">(' + escapeHtml(user.email) + ')</span>' : '')
        : escapeHtml(user.email || 'Signed in');
      authRegion.innerHTML =
        '<div class="mast-auth">' +
          '<span class="mast-auth-name">' + whoHtml + '</span>' +
          '<button class="btn-text" type="button" id="mastSignOutBtn">Sign out</button>' +
        '</div>';
      var so = document.getElementById('mastSignOutBtn');
      if (so) so.addEventListener('click', function(){ auth.signOut(); });
    } else {
      authRegion.innerHTML = '<button class="auth-signin" type="button" id="mastSignInBtn">Sign in with Slack</button>';
      var si = document.getElementById('mastSignInBtn');
      if (si) si.addEventListener('click', doSignIn);
    }
  }

  if (heroSignInBtn) heroSignInBtn.addEventListener('click', doSignIn);

  // The homepage's own content (the hero) stays public either way — a
  // signed-out visitor gets no masthead and no sidebar at all, just the
  // hero plus its own brief sign-up/log-in line; the masthead (with its
  // sidebar-only "Internal" branding) only makes sense once someone's
  // actually signed in. Toggling `hidden` on plain wrappers rather than
  // on .masthead/.gate-signup-btn/.auth-signin themselves matters: those
  // classes set their own `display`, which as an author rule beats the
  // browser's default [hidden]{display:none} at equal specificity, so
  // hidden silently does nothing on them directly (see .masthead[hidden]
  // and #pageGate[hidden] on the other pages for the same fix).
  function renderGuestChrome(signedIn){
    if (masthead) masthead.hidden = !signedIn;
    if (sidebar) sidebar.hidden = !signedIn;
    if (navToggle) navToggle.hidden = !signedIn;
    if (guestNote) guestNote.hidden = signedIn;
  }

  if (!auth) {
    renderGuestChrome(false);
  } else {
    auth.onAuthStateChanged(function(user){
      renderAuthRegion(user);
      renderGuestChrome(!!user);
    });
  }
})();
</script>

</body>
</html>
