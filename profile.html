<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | BOLD Lab</title>
<meta name="description" content="Your BOLD Lab profile.">
<meta property="og:title" content="Profile | BOLD Lab">
<meta property="og:description" content="Your BOLD Lab profile.">
<meta property="og:type" content="website">
<script src="bold.js" data-sdk="functions"></script>
<style>
  :root{
    --success-text:#256b60;
    --danger-text:#b42318;
    --warn-text:#8a5a12;
    --neutral-text:#4b5563;
  }
  /* ---------- hero ---------- */
  .hero{max-width:var(--content-max); margin:0 auto; padding:64px var(--gutter) 10px;}
  .hero h1{font-size:clamp(30px, 5vw, 44px); line-height:1.14; overflow-wrap:break-word; max-width:var(--article-max); text-wrap:balance;}
  .hero-note{margin:20px 0 0; font-size:18px; color:var(--ink-soft); max-width:var(--article-max);}
  .hero-actions{display:flex; flex-wrap:wrap; gap:24px; margin-top:10px; font-family:var(--sans); font-size:15px;}
  /* ---------- article ---------- */
  main{max-width:var(--content-max); margin:0 auto; padding:8px var(--gutter) 24px;}
  .btn{
    display:inline-block; font-family:var(--sans); font-size:15px; font-weight:500;
    text-decoration:underline; text-decoration-color:rgba(26,43,74,.32); text-underline-offset:3px;
    padding:0; border:none;
  }
  .btn:hover{text-decoration-color:currentColor;}
  .btn-primary{color:var(--accent); font-weight:600;}
  .btn-secondary{color:var(--ink-soft);}
  /* Hierarchy on this page, outermost first: section (larger h2 + hairline,
     wide gap) > group (small caps label + count) > row (faint hairline). */
  section.block{max-width:var(--article-max); margin:80px 0 0;}
  section.block:first-of-type{margin-top:28px;}
  .block-head{padding-bottom:10px; border-bottom:1px solid var(--line);}
  .block h2{font-family:var(--serif); font-size:28px; line-height:1.2; letter-spacing:-0.005em; color:var(--ink); font-weight:700;}
  /* ---------- profile ---------- */
  .profile-head{display:flex; align-items:center; gap:20px;}
  .profile-photo{width:72px; height:72px; border-radius:50%; object-fit:cover; flex:none; background:var(--wash);}
  .profile-photo[hidden]{display:none;}
  .facts{margin:0;}
  .facts--slack{margin-top:0;}
  .facts--slack[hidden]{display:none;}
  .fact{display:flex; gap:24px; padding:3px 0; border-bottom:1px solid rgba(26,43,74,0.08);}
  .fact dt{flex:0 0 150px; font-family:var(--sans); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); padding-top:5px;}
  .fact dd{margin:0; font-size:17px; color:var(--ink); overflow-wrap:anywhere;}
  .proj-group{margin-top:34px;}
  .proj-group:first-child{margin-top:22px;}
  .proj-group h3{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 2px;}
  .proj-count{margin-left:6px; font-weight:400; color:var(--muted);}
  .proj-list{list-style:none; margin:0; padding:0;}
  .proj-list li{padding:12px 0; border-bottom:1px solid rgba(26,43,74,0.08);}
  .proj-title{font-size:18px; font-weight:500;}
  .proj-meta{display:block; margin-top:2px; font-family:var(--sans); font-size:13px; color:var(--muted);}
  /* Same badges as the board's card page (audit-board.css .detail .badge):
     outlined, small caps, colour by meaning. */
  .proj-badges{display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:8px;}
  .badge{
    font-family:var(--sans); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em;
    border:1px solid currentColor; padding:2px 7px; color:var(--neutral-text);
  }
  .badge-stage{color:var(--accent);}
  .badge-review-approved, .badge-rebuttal-sent, .badge-outcome-accepted{color:var(--success-text);}
  .badge-review-changes_requested, .badge-outcome-rejected{color:var(--danger-text);}
  .badge-review-in_review, .badge-rebuttal-writing{color:var(--warn-text);}
  .badge-rebuttal-waiting, .badge-outcome-withdrawn{color:var(--neutral-text);}
  .proj-empty{margin:0; font-family:var(--sans); font-size:14px; color:var(--muted);}
  .proj-msg{font-family:var(--sans); font-size:14px; color:var(--muted); margin:14px 0 0;}
  @media (max-width:820px){
    .hero{padding:44px var(--gutter) 8px;}
  }
</style>
</head>
<body>

<bold-masthead></bold-masthead>

<bold-gate></bold-gate>

<bold-shell>
  <div class="shell-main">


<div class="hero">
  <div class="profile-head">
    <img class="profile-photo" id="profilePhoto" alt="" hidden>
    <h1 id="profileName">Profile</h1>
  </div>
</div>

<main>

  <section class="block">
    <div class="block-head">
      <h2>Basic info</h2>
    </div>
    <dl class="facts">
      <div class="fact"><dt>Name</dt><dd id="factName"></dd></div>
      <div class="fact"><dt>Email</dt><dd id="factEmail"></dd></div>
    </dl>
    <dl class="facts facts--slack" id="slackFacts" hidden></dl>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>Projects</h2>
    </div>
    <p class="proj-msg" id="projMsg">Loading&hellip;</p>
    <div id="projects" hidden>
      <div class="proj-group"><h3>Owner<span class="proj-count" id="cntOwner"></span></h3><ul class="proj-list" id="projOwner"></ul></div>
      <div class="proj-group"><h3>Author<span class="proj-count" id="cntAuthor"></span></h3><ul class="proj-list" id="projAuthor"></ul></div>
      <div class="proj-group"><h3>Reviewer<span class="proj-count" id="cntReviewer"></span></h3><ul class="proj-list" id="projReviewer"></ul></div>
    </div>
  </section>

</main>

<bold-footer></bold-footer>
</div>
</bold-shell>

<script>
(function(){
  var escapeHtml = BOLD.escapeHtml;

  // The masthead, gate and sidebar are bold.js's; this page only fills in the profile.
  if (!BOLD.getAuth()) return;
  BOLD.onUser(renderProfile);

  /* ---------- profile ---------- */
  var el = function(id){ return document.getElementById(id); };

  // Cloud Function results are cached per person in localStorage: shown at
  // once on open, refetched only once older than CACHE_TTL_MS (and cleared
  // on sign-out). If a refetch fails, the cached copy stays on screen.
  var CACHE_TTL_MS = 15 * 60 * 1000;
  var CACHE_PREFIX = 'boldProfile:';

  function cacheGet(key){
    try { return JSON.parse(localStorage.getItem(CACHE_PREFIX + key) || 'null'); } catch (e) { return null; }
  }
  function cachePut(key, data){
    try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ t: Date.now(), d: data })); } catch (e){}
  }
  function cacheClearKey(key){
    try { localStorage.removeItem(CACHE_PREFIX + key); } catch (e){}
  }
  function showPhoto(url){
    var photo = el('profilePhoto');
    if (url) { if (photo.getAttribute('src') !== url) photo.src = url; photo.hidden = false; } else { photo.hidden = true; }
  }
  function cacheClear(){
    try {
      Object.keys(localStorage).forEach(function(k){ if (k.indexOf(CACHE_PREFIX) === 0) localStorage.removeItem(k); });
    } catch (e){}
  }

  // Renders from cache if any, then calls the function only if there's no
  // fresh cache. onError only fires when there was nothing cached to show.
  function loadCached(fn, email, render, onError){
    var key = fn + ':' + email.toLowerCase();
    var hit = cacheGet(key);
    if (hit) render(hit.d);
    var age = hit ? Math.round((Date.now() - hit.t) / 1000) : null;
    if (hit && Date.now() - hit.t < CACHE_TTL_MS) { console.info('[BOLD Lab] ' + fn + ': cache hit (' + age + 's old), no call'); return; }
    var call;
    try { call = firebase.app().functions('europe-west2').httpsCallable(fn); }
    catch (e) { if (!hit) onError(e); return; }
    var t0 = performance.now();
    call().then(function(res){
      var data = res.data || {};
      console.info('[BOLD Lab] ' + fn + ': fetched in ' + Math.round(performance.now() - t0) + 'ms (' + (hit ? 'stale cache shown ' + age + 's old' : 'no cache') + ')');
      cachePut(key, data);
      render(data);
    }).catch(function(err){
      console.error('[BOLD Lab] ' + fn + ' failed', err);
      if (!hit) onError(err);
    });
  }

  // Institution, role, supervisor, research interests, start date, ... —
  // the caller's own Slack custom profile fields (getMyProfile). Silent on
  // failure: the page is complete without them.
  function renderSlackFacts(data){
    var box = el('slackFacts');
    var fields = data.fields || [];
    box.innerHTML = '';
    fields.forEach(function(f){
      var row = document.createElement('div'); row.className = 'fact';
      var dt = document.createElement('dt'); dt.textContent = f.label;
      var dd = document.createElement('dd'); dd.textContent = f.value;
      row.appendChild(dt); row.appendChild(dd); box.appendChild(row);
    });
    box.hidden = !fields.length;
  }

  function renderIdentity(name, email){
    el('profileName').textContent = name || email || 'Profile';
    el('factName').textContent = name || '\u2014';
    el('factEmail').textContent = email || '\u2014';
  }

  function renderProfile(user){
    if (!user) { cacheClear(); el('slackFacts').hidden = true; return; }
    renderIdentity(user.displayName || '', user.email);
    showPhoto(user.photoURL);
    if (user.photoURL) cachePut('photo', user.photoURL); else cacheClearKey('photo');

    if (!user.email) return;
    loadCached('getMyProfile', user.email, renderSlackFacts, function(){});
    loadCached('getMyProjects', user.email, renderProjects, function(){
      el('projMsg').textContent = 'Could not load projects.';
    });
  }

  function renderProject(p){
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'proj-title';
    a.href = 'audit-board.html#board=' + encodeURIComponent(p.boardId) + '&card=' + encodeURIComponent(p.cardId);
    a.textContent = p.title;
    var meta = document.createElement('span');
    meta.className = 'proj-meta';
    meta.textContent = [p.boardLabel, p.role && p.role + ' reviewer'].filter(Boolean).join(' · ');
    li.appendChild(a); li.appendChild(meta);
    if (p.badges && p.badges.length) {
      var row = document.createElement('div');
      row.className = 'proj-badges';
      p.badges.forEach(function(b){
        var span = document.createElement('span');
        span.className = 'badge badge-' + String(b.kind).replace(/[^a-z_-]/g, '');
        span.textContent = b.label;
        row.appendChild(span);
      });
      li.appendChild(row);
    }
    return li;
  }

  // The caller's papers on the Internal Review Board, by relationship
  // (getMyProjects).
  function renderProjects(data){
    [['projOwner', data.owner, 'cntOwner'], ['projAuthor', data.author, 'cntAuthor'], ['projReviewer', data.reviewer, 'cntReviewer']].forEach(function(g){
      var ul = el(g[0]); ul.innerHTML = '';
      var items = g[1] || [];
      el(g[2]).textContent = items.length || '';
      if (!items.length) {
        var li = document.createElement('li');
        li.innerHTML = '<p class="proj-empty">None</p>';
        ul.appendChild(li);
      }
      items.forEach(function(p){ ul.appendChild(renderProject(p)); });
    });
    el('projMsg').hidden = true;
    el('projects').hidden = false;
  }
  // First paint from the last visit's sign-in hint (same one the masthead
  // uses) plus any cached sections — before Firebase has loaded or signed
  // in. Cache only, no network; renderProfile() above takes over once auth
  // resolves.
  try {
    var hint = BOLD.authHint();
    if (hint && hint.e) {
      renderIdentity(hint.n || '', hint.e);
      var ph = cacheGet('photo');
      if (ph && ph.d) showPhoto(ph.d);
      [['getMyProfile', renderSlackFacts], ['getMyProjects', renderProjects]].forEach(function(p){
        var hit = cacheGet(p[0] + ':' + hint.e.toLowerCase());
        if (hit) p[1](hit.d);
      });
    }
  } catch (e){}
})();
</script>

</body>
</html>
