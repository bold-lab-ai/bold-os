<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralax · BOLD OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* BOLD OS design tokens (src/assets/css/bold.css): one accent, serif to read, sans for chrome,
   no border-radius, outlined badges, hairline rules. */
:root{
  --ink:#1a2b4a; --ink-soft:#33445f; --muted:#7d8698; --paper:#f5f3ee; --surface:#ffffff; --wash:#ece9e1;
  --line:rgba(26,43,74,0.16); --accent:#1a2b4a;
  --serif:'EB Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Cabin', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* flex/grid display rules otherwise beat the UA [hidden] rule */
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink-soft);font-family:var(--serif);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.masthead{border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.brand{flex:0 1 auto;min-width:0}
.wordmark{font-family:var(--sans);font-weight:500;font-size:17px;color:var(--ink);letter-spacing:-0.01em}
.sub{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.problem{flex:1 1 360px;display:flex;flex-direction:column;gap:4px}
.label{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
#problem{min-height:46px;max-height:130px;resize:vertical;padding:6px 10px;font-size:16px}
.controls{display:flex;gap:16px;align-items:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft);padding-top:18px;flex-wrap:wrap}
.controls select{font-family:var(--sans);font-size:13px;padding:3px 6px}
.links{flex:1 1 100%;font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.links code{font-size:12px;background:var(--surface);border:1px solid var(--line);padding:1px 6px;user-select:all}
.links .seat{color:var(--muted)}.links .seat.taken{color:var(--ink)}
.btn-text{font-family:var(--sans);font-size:12.5px;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;
  text-decoration:underline;text-decoration-color:rgba(26,43,74,.32);text-underline-offset:2px}
.btn-text:hover{text-decoration-color:currentColor}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);background:none;border:1px solid var(--ink);
  padding:8px 14px;cursor:pointer;border-radius:0}
.btn:hover{background:var(--wash)}
main{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:16px;min-height:0}
main.single{grid-template-columns:minmax(0,760px);justify-content:center}
.pane{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--sans)}
.badge{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink);border:1px solid var(--ink);
  padding:0 6px;line-height:18px;display:inline-block;white-space:nowrap}
.badge.soft{border-color:var(--line);color:var(--muted);font-weight:500}
.top input{flex:1;min-width:0;font-family:var(--sans);font-weight:600;font-size:15px;border:1px solid transparent;background:transparent;padding:3px 6px}
.top input:hover{border-color:var(--line)}
.top .hint{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:94%}
.msg .who{font-family:var(--sans);font-size:11px;letter-spacing:.04em;color:var(--muted);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.msg .body{padding:8px 12px;border:1px solid var(--line);word-wrap:break-word}
.msg.user{align-self:flex-end}
.msg.user .who{justify-content:flex-end}
.msg.user .body{background:var(--wash);border-color:transparent;color:var(--ink)}
.msg.agent{align-self:flex-start}
.msg.error .body{border-style:dashed;color:var(--muted)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:2px 0 6px 20px;padding:0}.msg li{margin:2px 0}
.msg pre{background:var(--paper);padding:8px;overflow-x:auto;font-size:13px}
.msg code{font-size:14px;background:var(--paper);padding:0 3px}
.msg.pending .body{color:var(--muted);font-family:var(--sans);font-size:13px}
.msg.pending .body::after{content:"composing a reply…";animation:fade 1.4s infinite}
@keyframes fade{50%{opacity:.35}}
.rtag{align-self:flex-start;max-width:94%;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);border-left:2px solid var(--line);padding:2px 0 2px 8px;margin-top:-6px}
.rtag.none{color:var(--muted)}
.rtag .pick{display:block;margin-top:2px}
.composer{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-height:46px;max-height:180px;resize:vertical;padding:7px 10px;font-size:16px}
a{color:var(--accent);text-decoration-color:rgba(26,43,74,.32);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
.chooser{max-width:560px;margin:40px auto;padding:0 16px;font-size:18px}
.chooser h1{font-size:28px;color:var(--ink);margin:0 0 10px}
.chooser ul{list-style:none;padding:0;margin:18px 0}
.chooser li{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center}
#err{position:fixed;left:16px;bottom:16px;background:var(--surface);color:#8a1c1c;border:1px solid #8a1c1c;padding:8px 12px;
  font-family:var(--sans);font-size:12px;display:none;max-width:70vw;white-space:pre-wrap}
@media (max-width:900px){main{grid-template-columns:1fr;overflow-y:auto}.pane{min-height:440px}.controls{padding-top:0}}
</style>
</head>
<body>
<header class="masthead" id="masthead" hidden>
  <div class="brand">
    <div class="wordmark">BOLD OS · Paralax</div>
    <div class="sub" id="sub">your own assistant, informed by the group</div>
  </div>
  <div class="problem">
    <span class="label">The shared problem</span>
    <textarea id="problem" placeholder="State the problem you are working on together. Everyone, and every assistant, sees this."></textarea>
  </div>
  <div class="links" id="links" hidden></div>
  <div class="controls" id="controls" hidden>
    <label>assistants use <select id="mode">
      <option value="workspace">workspace (selection)</option>
      <option value="context">context (control)</option>
      <option value="isolated">isolated</option>
    </select></label>
    <button class="btn-text" id="reset">new session</button>
  </div>
</header>
<main id="main"></main>
<div id="err"></div>
<script>
(function(){
"use strict";
var params = new URLSearchParams(location.search);
var SEAT = params.get("seat"), KEY = params.get("key");
var VIEW = location.pathname.replace(/\/+$/, "") === "/workspace" ? "researcher" : ((SEAT || params.get("pane")) ? "participant" : "chooser");
var QS = VIEW === "researcher" ? ("view=workspace" + (KEY ? "&key=" + encodeURIComponent(KEY) : ""))
       : VIEW === "participant" ? (SEAT ? "seat=" + encodeURIComponent(SEAT) : "pane=" + encodeURIComponent(params.get("pane"))) : "";
var PANES = [], NAMES = {}, after = 0, es = null;
var mainEl = document.getElementById("main"), errEl = document.getElementById("err");
var problemEl = document.getElementById("problem"), modeEl = document.getElementById("mode");

function showErr(t){ errEl.style.display = "block"; errEl.textContent = t; }
window.onerror = function(m, src, line){ showErr("page error: " + m + " (line " + line + ")"); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

// Minimal markdown: code fences, inline code, bold, italic, bulleted and numbered lists, paragraphs.
function md(s){
  var h = esc(s), pres = [];
  h = h.replace(/```[a-z]*\n?([\s\S]*?)```/g, function(m, c){ pres.push(c); return "\u0001" + (pres.length - 1) + "\u0001"; });
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  var out = [], list = null, lines = h.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i], m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) { (list = list || []).push("<li>" + m[1] + "</li>"); continue; }
    if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
    if (!line.trim()) continue;
    var pm = line.match(/^\u0001(\d+)\u0001$/);
    out.push(pm ? "<pre>" + pres[+pm[1]] + "</pre>" : "<p>" + line + "</p>");
  }
  if (list) out.push("<ul>" + list.join("") + "</ul>");
  return out.join("");
}

function post(path, body){
  return fetch(path + (QS ? "?" + QS : ""), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .catch(function(e){ showErr("request failed: " + e); });
}

// ---------------------------------------------------------------- seat chooser
function chooser(s){
  var items = s.panes.map(function(p){
    var named = !/^Person [A-Z]$/.test(s.names[p]);
    return '<li><span class="badge">' + p + '</span><a href="/?pane=' + p + '">' + (named ? esc(s.names[p]) : "free seat") + "</a></li>";
  }).join("");
  mainEl.className = "";
  mainEl.innerHTML = '<div class="chooser"><h1>Paralax</h1>' +
    "<p>Pick your seat. You will see only your own conversation with your own assistant. " +
    "Your assistant can draw on what the others in the session have typed when it helps, and theirs on what you type.</p>" +
    "<ul>" + items + "</ul>" +
    '<p style="font-size:15px">Two people on one laptop: open each seat in its own browser window. ' +
    'Researchers: <a href="/workspace">workspace view</a>.</p></div>';
}

// ---------------------------------------------------------------- panes
function build(panes){
  mainEl.innerHTML = "";
  mainEl.className = panes.length === 1 ? "single" : "";
  panes.forEach(function(p){
    var el = document.createElement("section");
    el.className = "pane";
    el.innerHTML =
      '<div class="top"><span class="badge">' + p + '</span>' +
      '<input id="name' + p + '" placeholder="Your name" title="Your name, as your assistant and the others’ assistants will refer to you">' +
      '<span class="hint" id="hint' + p + '">' + (VIEW === "researcher" ? "" : "your own assistant") + '</span></div>' +
      '<div class="log" id="log' + p + '"></div>' +
      '<div class="composer"><textarea id="in' + p + '" placeholder="Write to your assistant. Enter sends, Shift+Enter starts a new line."></textarea>' +
      '<button class="btn" id="send' + p + '">Send</button></div>';
    mainEl.appendChild(el);
    var ta = document.getElementById("in" + p), nm = document.getElementById("name" + p);
    document.getElementById("send" + p).onclick = function(){ send(p); };
    ta.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(p); } });
    nm.addEventListener("change", function(){ if (nm.value.trim()) post("/name", {pane: p, name: nm.value.trim()}); });
  });
}

function send(p){
  var ta = document.getElementById("in" + p), nm = document.getElementById("name" + p);
  var text = ta.value.trim(); if (!text) return;
  ta.value = "";
  post("/send", {pane: p, text: text, name: nm.value.trim()});
}

function nearBottom(log){ return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
function append(log, el, force){ var stick = nearBottom(log); log.appendChild(el); if (stick || force) log.scrollTop = log.scrollHeight; }

function renderMsg(e){
  var log = document.getElementById("log" + e.pane); if (!log) return;
  var el = document.getElementById("m" + e.id), isNew = !el;
  if (isNew) { el = document.createElement("div"); el.id = "m" + e.id; el.innerHTML = '<div class="who"></div><div class="body"></div>'; }
  var who = e.type === "user" ? esc(NAMES[e.pane] || e.name)
          : "your assistant" + (e.secs ? ' <span class="badge soft">' + esc(e.secs) + " s</span>" : "");
  el.className = "msg " + e.type + (e.status === "pending" ? " pending" : "") + (e.status === "error" ? " error" : "");
  el.querySelector(".who").innerHTML = who;
  el.querySelector(".body").innerHTML = e.status === "pending" ? "" : md(e.text);
  if (isNew) append(log, el, e.type === "user");
}

// Researcher only: what the assistant's background step took from the workspace for this reply.
var TURNS = {};
function renderRetrieval(r){
  var log = document.getElementById("log" + r.pane); if (!log || document.getElementById("r" + r.id)) return;
  var el = document.createElement("div"); el.id = "r" + r.id;
  var head = "workspace · " + (r.status === "ok" ? "" : r.status + " · ") + r.considered.length + " considered · " + r.secs + " s";
  var picks = (r.inform || []).map(function(x){
    var t = TURNS[x.turn] || {};
    return '<span class="pick" title="' + esc(x.why) + '">[' + esc(x.relation) + "] " + esc(t.name || "") + " #" + x.turn + ": " + esc((t.text || "").slice(0, 90)) + "</span>";
  });
  if (r.ask) { var t = TURNS[r.ask.turn] || {}; picks.push('<span class="pick" title="' + esc(r.ask.why) + '">[ask] ' + esc(t.name || "") + " #" + r.ask.turn + ": " + esc((t.text || "").slice(0, 90)) + "</span>"); }
  el.className = "rtag" + (picks.length ? "" : " none");
  el.innerHTML = head + (picks.length ? picks.join("") : " · nothing used");
  append(log, el, false);
}

function setNames(names){
  NAMES = names;
  PANES.forEach(function(p){
    var nm = document.getElementById("name" + p);
    if (nm && document.activeElement !== nm) nm.value = /^Person [A-Z]$/.test(names[p] || "") ? "" : names[p];
    var log = document.getElementById("log" + p);
    if (log) log.querySelectorAll(".msg.user .who").forEach(function(w){ w.textContent = names[p]; });
  });
}

function handle(ev){
  if (ev.type === "status") return;
  if (ev.type === "reset") return location.reload();
  if (ev.id) after = Math.max(after, ev.id);
  if (ev.type === "user") TURNS[ev.id] = {name: NAMES[ev.pane] || ev.name, text: ev.text};
  if (ev.type === "user" || ev.type === "agent") renderMsg(ev);
  else if (ev.type === "retrieval") renderRetrieval(ev);
  else if (ev.type === "name") { NAMES[ev.pane] = ev.name; setNames(NAMES); }
  else if (ev.type === "problem") { if (document.activeElement !== problemEl) problemEl.value = ev.text; }
  else if (ev.type === "settings") modeEl.value = ev.settings.mode;
}

function connect(){
  if (es) es.close();
  es = new EventSource("/events?" + QS + "&after=" + after);
  es.onmessage = function(e){ handle(JSON.parse(e.data)); };
  es.onerror = function(){ es.close(); setTimeout(connect, 1500); };
}

function load(){
  fetch("/state?" + QS).then(function(r){ return r.json(); }).then(function(s){
    if (VIEW === "chooser") return chooser(s);
    document.getElementById("masthead").hidden = false;
    if (VIEW === "researcher") {
      document.getElementById("controls").hidden = false;
      document.getElementById("sub").textContent = "researcher view: every conversation and what each assistant drew on";
      modeEl.value = (s.settings || {}).mode || "workspace";
      if (s.links) {
        var L = document.getElementById("links"); L.hidden = false;
        L.innerHTML = '<span><b>Join link</b> (give this to people; each click takes the next free seat): <code>' + esc(location.origin + "/join?room=" + s.links.room) + "</code></span>" +
          '<span><b>Seats</b>: ' + s.links.seats.map(function(x){ return '<span class="seat' + (x.claimed ? " taken" : "") + '" title="' + esc(location.origin + "/?seat=" + x.token) + '">' + x.pane + (x.claimed ? " " + esc(s.names[x.pane] || "taken") : " free") + "</span>"; }).join(" · ") +
          '</span><span class="st">hover a seat for its direct link, to resend to someone who lost theirs</span>';
      }
    } else {
      problemEl.readOnly = true;
      problemEl.placeholder = "The host sets the shared problem here.";
    }
    PANES = s.panes; build(PANES); setNames(s.names);
    problemEl.value = s.problem || "";
    var all = s.events.concat(s.retrievals || []).sort(function(a, b){ return a.id - b.id; });
    all.forEach(function(e){ handle(e); });
    after = s.last_id;
    connect();
  }).catch(function(e){ showErr("could not reach the Paralax server: " + e); });
}

problemEl.addEventListener("change", function(){ post("/problem", {text: problemEl.value}); });
modeEl.addEventListener("change", function(){ post("/settings", {mode: modeEl.value}); });
document.getElementById("reset").onclick = function(){
  if (confirm("Start a new, empty session for everyone? The current one stays saved in paralax/sessions/.")) post("/reset", {});
};
load();
})();
</script>
</body>
</html>
